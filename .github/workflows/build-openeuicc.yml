name: OpenEUICC privileged build

on:
  workflow_dispatch:
  push:
    branches:
      - moto-kansas-esim
    paths:
      - "app/**"
      - "app-common/**"
      - "app-deps/**"
      - "buildSrc/**"
      - "gradle/**"
      - "libs/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "privapp_whitelist_im.angry.openeuicc.xml"
      - ".github/workflows/build-openeuicc.yml"

permissions:
  contents: read

concurrency:
  group: openeuicc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build privileged OpenEUICC
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify submodules
        run: |
          git submodule status
          test -d libs/lpac-jni/src/main/jni/lpac
          test -d libs/lpac-jni/src/main/jni/cjson/cjson

      - name: Build privileged APK and Magisk module
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --build-cache --stacktrace \
            :app:assembleDebug \
            :app:assembleDebugMagiskModule

      - name: Verify build outputs
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          find app/build/magisk -maxdepth 1 -type f -name '*.zip' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -f app/build/magisk/magisk-debug.zip

      - name: Upload APK and module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openeuicc-privileged-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/magisk/magisk-debug.zip
            app/build/outputs/apk/**/output-metadata.json
